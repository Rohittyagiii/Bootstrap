<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Images and Videos Bootstrap</title>
</head>
<body>
    <div class="container">
        <h2>Bootstrap Images and Videos classes</h2>
        <div class="row py-3">
         <div class="col-md-4">
            <img src="./assests/bear.jpg" alt="" class="img-fluid rounded-pill">
         </div>
         <div class="col-md-4">
            <img src="./assests/bear.jpg" alt="" class="img-fluid img-thumbnail">
         </div>
         <div class="col-md-4">
            <figure class="figure">
                 <img src="./assests/bear.jpg" alt="" class="img-fluid figure-img">
                 <figcaption class="fig-caption text-end">Bhalooo Ki Image</figcaption>
                  <!-- <h2>Bhaloo ki Image</h2> -->
            </figure>
           
         </div>
        </div>
        <div class="row py-3">
        <div class="col-md-4">
            <div class="embed-responsive embed-responsive-16by9">
                <iframe src="https://www.youtube.com/embed/dTsrUZVlmJk?si=J1xyX15qgEcnnE6N"  class="embed-responsive-item" frameborder="0">
                </iframe>
            </div>
        </div>
         <div class="col-md-4">
            <div class="embed-responsive embed-responsive-16by9">
                <iframe src="https://www.youtube.com/embed/dMByhaezv9A?si=3E2cQcJKypjp0AnI"  class="embed-responsive-item" frameborder="0">
                </iframe>
            </div>
            </div>
             <div class="col-md-4">
            <div class="embed-responsive embed-responsive-16by9">
                <iframe src="https://www.youtube.com/embed/hHuG7FIKgtc?si=U3deMPF_6GfuF13L"  title="YouTube video" 
                      allowfullscreen frameborder="0">
                </iframe>
            </div>
            </div>
    </div>
 </div>
</body>
</html>
