<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <title>PopOver Bootstrap 5</title>
</head>

<body>
    <div class="container">
        <h2 class="text-center py-3">Bootstrap PopOver class</h2>
        <div class="row py-5">
            <div class="col-md-7 mx-auto">
                <button type="button" class="btn btn-primary" data-bs-toggle="popover" data-bs-placement="bottom"
                    title="Popover Title" data-bs-content="Lorem ipsum dolor sit amet, consectetur adipisicing elit.">
                    PopOver</button>

                    <button type="button" class="btn btn-primary" data-bs-toggle="popover" data-bs-placement="top"
                    title="Popover Title 2" data-bs-content="Lorem ipsum dolor sit amet, consectetur adipisicing e amet, consectetur adipisicing elit.">
                    PopOver</button>

                    <button type="button" class="btn btn-primary" data-bs-toggle="popover" data-bs-placement="right"
                    title="Popover Title 3" data-bs-content="Lorem ipsum dolor  sit amet, consectetur  sit amet, consectetur adipisicing elit.">
                    PopOver</button>

            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'))
            var popoverList = popoverTriggerList.map(function (popoverTriggerEl) {
                return new bootstrap.Popover(popoverTriggerEl)
            })
        });
    </script>
</body>

</html>
